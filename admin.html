<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Shopping D</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef4f5;color:#123}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(460px,100%);background:#fff;padding:32px;border-radius:20px;box-shadow:0 12px 35px #0002}h1{color:#07556b}.sub{color:#65777d;margin-bottom:24px}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:14px;border:1px solid #c7d6da;border-radius:10px;font-size:16px}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#ef5b13;color:#fff;font-size:17px;font-weight:700;cursor:pointer}#erro{display:none;margin-top:14px;padding:10px;background:#ffe9e9;color:#a00;border-radius:8px}#painel{display:none;padding:30px}header{background:#07556b;color:#fff;padding:20px;border-radius:12px}
</style></head>
<body>
<section id="login" class="login"><div class="card">
<h1>Área Administrativa</h1><div class="sub">Shopping D • Acesso restrito</div>
<form id="formLogin">
<label>E-mail</label><input id="email" type="email" required>
<label>Senha</label><input id="senha" type="password" required>
<button type="submit">Entrar</button><div id="erro">E-mail ou senha incorretos.</div>
</form></div></section>
<section id="painel"><header><h2>Admin | Shopping D</h2></header>
<p>Acesso administrativo autorizado.</p>
<button id="sair" style="max-width:160px">Sair</button>
</section>
<script>
const ADMIN_EMAIL="admin@shoppingd.com.br";
const ADMIN_PASSWORD="argoplangabriel2026";
const login=document.getElementById("login"),painel=document.getElementById("painel"),erro=document.getElementById("erro");
function abrir(){login.style.display="none";painel.style.display="block"}
if(sessionStorage.getItem("shoppingd_admin")==="1")abrir();
document.getElementById("formLogin").addEventListener("submit",e=>{e.preventDefault();if(document.getElementById("email").value.trim().toLowerCase()===ADMIN_EMAIL&&document.getElementById("senha").value===ADMIN_PASSWORD){sessionStorage.setItem("shoppingd_admin","1");erro.style.display="none";abrir()}else erro.style.display="block"});
document.getElementById("sair").onclick=()=>{sessionStorage.removeItem("shoppingd_admin");location.reload()};
</script></body></html>
