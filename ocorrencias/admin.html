<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrativo • Ocorrências</title><link rel="stylesheet" href="style.css"></head><body><header class="hero"><div class="head"><div class="brand"><img class="logo" src="../argoplan-shoppingd.png"><div><h1>Administrativo</h1><p>Gestão completa das ocorrências.</p></div></div><div><button onclick="edit(0)">+ Nova ocorrência</button> <button onclick="logout()">Sair</button></div></div></header><main class="wrap"><div id="msg" class="error hidden"></div><div id="adminList"></div></main><div id="editor" class="overlay hidden"><div class="panel"><h2>Editar ocorrência</h2><form id="form" class="grid" onsubmit="return false"><label>Número<input id="number" type="number"></label><label>Título<input id="title"></label><label>Categoria<select id="category"><option>Furto</option><option>Tentativa de furto</option><option>Acidente</option><option>Desinteligência</option><option>Assédio</option><option>Avaria</option><option>Perda de objeto</option><option>Outros</option></select></label><label>Status<select id="status"><option>Em análise</option><option>Em andamento</option><option>Concluída</option><option>Arquivada</option></select></label><label>Prioridade<select id="priority"><option>Baixa</option><option>Média</option><option>Alta</option><option>Crítica</option></select></label><label>Data<input id="date" type="date"></label><label>Horário<input id="time" type="time"></label><label>Local<input id="location"></label><label>Responsável<input id="responsible"></label><label>Protocolo / BO<input id="protocol"></label><label class="full">Envolvidos<input id="involved"></label><label class="full">Descrição<textarea id="description"></textarea></label><label class="full">Providências<textarea id="actions"></textarea></label></form><div class="actions"><button onclick="del()">Excluir</button><button onclick="closeEditor()">Cancelar</button><button onclick="save()">Salvar</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
